[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-rolebench"
version = "0.1.0"
description = "Contract-first role benchmarking and routing for Oh My Pi"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.19,<5",
]

[project.scripts]
rolebench = "rolebench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
